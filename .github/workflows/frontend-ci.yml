name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test y build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias (ci = instalación limpia y reproducible)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests unitarios (Vitest + RTL)
        # Corre antes del build para fallar rápido si una regresión rompe
        # el contrato frontend↔backend (ej. array → Page<T> del 13/07).
        run: npm run test

      - name: Build de producción
        run: npm run build
