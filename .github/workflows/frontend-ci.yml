name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test y build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias (ci = instalación limpia y reproducible)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests unitarios (Vitest + RTL)
        # Corre antes del build para fallar rápido si una regresión rompe
        # el contrato frontend↔backend (ej. array → Page<T> del 13/07).
        run: npm run test

      - name: Build de producción
        run: npm run build

  e2e:
    name: E2E (Playwright, sin backend)
    runs-on: ubuntu-latest
    needs: build

    env:
      # Hace que el test de registro de chunk-error-recovery.spec.ts se
      # salte: sin backend real no puede completar un registro.
      CI_SIN_BACKEND: "1"

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias (ci = instalación limpia y reproducible)
        run: npm ci

      - name: Build de producción
        run: npm run build

      - name: Instalar navegador de Playwright
        run: npx playwright install --with-deps chromium

      - name: Levantar la app (next start en :3000)
        run: |
          npm run start -- -p 3000 > next-start.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/login; then
              echo "App lista en :3000 (intento $i)"
              exit 0
            fi
            sleep 2
          done
          echo "La app no arrancó a tiempo:"
          cat next-start.log
          exit 1

      - name: E2E autónomos (headers de seguridad y recuperación de chunk)
        # Solo los specs que NO requieren backend: security-headers.spec.ts y
        # chunk-error-recovery.spec.ts (su test de registro se salta con
        # CI_SIN_BACKEND=1). registro.spec.ts y sesion-expirada.spec.ts
        # corren manual (requieren backend real en BACKEND_URL;
        # sesion-expirada además un ambiente dedicado con
        # JWT_EXPIRATION=6000, ver cabecera del spec).
        run: npx playwright test e2e/security-headers.spec.ts e2e/chunk-error-recovery.spec.ts
